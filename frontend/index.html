<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacts</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="d-flex vh-100">
    <nav id="contact-nav" class="d-flex flex-column border-end flex-shrink-0">
      <div class="p-2 border-bottom">
        <div class="position-relative">
          <input
            id="search-input"
            type="text"
            class="form-control pe-4"
            placeholder="Search contacts…"
            aria-label="Search contacts"
          >
          <button
            id="search-clear"
            type="button"
            class="btn-close position-absolute top-50 end-0 translate-middle-y me-2"
            aria-label="Clear search"
            hidden
          ></button>
        </div>
      </div>
      <div id="list-status" class="px-2 pt-2"></div>
      <div id="contact-list" class="list-group list-group-flush overflow-auto flex-grow-1"></div>
    </nav>

    <main id="contact-detail" class="flex-grow-1 overflow-auto p-4"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
